<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f7;--surface:#ffffff;--ink:#17202b;--muted:#566173;--line:#d9dee5;--accent:#1d5b86;--accent-ink:#ffffff;
  --verify:#8a5300;--verify-bg:#fff1d6;--hold:#4d43a6;--hold-bg:#ebe9fb;--sent:#17703f;--sent-bg:#def2e6;
  --pass:#5f6773;--pass-bg:#eceff2;--coord:#a8352b;--coord-bg:#fce8e6;--open:#1d5b86;--open-bg:#e2eef7;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161c;--surface:#1b2129;--ink:#e7ebf0;--muted:#9ba6b5;--line:#2d3540;--accent:#86bde3;--accent-ink:#0d1620;
    --verify:#f1bb66;--verify-bg:#382b13;--hold:#b8aff6;--hold-bg:#29263f;--sent:#82d3a5;--sent-bg:#163025;
    --pass:#a9b2be;--pass-bg:#252b33;--coord:#f19d93;--coord-bg:#3a201d;--open:#86bde3;--open-bg:#1c2b38;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c;--surface:#1b2129;--ink:#e7ebf0;--muted:#9ba6b5;--line:#2d3540;--accent:#86bde3;--accent-ink:#0d1620;
  --verify:#f1bb66;--verify-bg:#382b13;--hold:#b8aff6;--hold-bg:#29263f;--sent:#82d3a5;--sent-bg:#163025;
  --pass:#a9b2be;--pass-bg:#252b33;--coord:#f19d93;--coord-bg:#3a201d;--open:#86bde3;--open-bg:#1c2b38;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:880px;margin:0 auto;padding:14px 16px 0}
h1{margin:0;font-size:1.45rem;letter-spacing:-.01em}
.sub{margin:2px 0 10px;color:var(--muted);font-size:.95rem}
.tabs{display:flex;flex-wrap:wrap;gap:2px 4px;margin:0;padding:0 0 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.95rem;padding:7px 10px 8px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:1.5em;margin-left:6px;padding:0 6px;border-radius:9px;background:var(--bg);color:var(--muted);font-size:.82rem;text-align:center}
.tab:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:880px;margin:0 auto;padding:16px 16px 48px}
.msg{padding:28px 18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--open);border-radius:10px;margin:0 0 16px;padding:16px 18px}
.card[data-s="Sent"]{border-left-color:var(--sent)}
.card[data-s="Hold"]{border-left-color:var(--hold)}
.card[data-s="Pass"]{border-left-color:var(--pass)}
.card[data-s="Coordinate"]{border-left-color:var(--coord)}
.card[data-s="Verify"]{border-left-color:var(--verify)}
.head h2{margin:0 0 4px;font-size:1.3rem;line-height:1.25}
.facts{margin:0;padding:0;list-style:none;color:var(--muted)}
.facts li{margin:0}
.facts .send{color:var(--ink);font-weight:700}
.facts .late{color:var(--coord)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fnotes{margin:4px 0 0;padding-left:18px;font-size:.85rem;color:var(--muted)}
.fnotes li{margin:2px 0}
.chip{font-size:.85rem;padding:2px 10px;border-radius:999px;font-weight:700}
.chip.Verify{background:var(--verify-bg);color:var(--verify)}
.chip.Coordinate{background:var(--coord-bg);color:var(--coord)}
.chip.Campus{background:var(--hold-bg);color:var(--hold)}
.chip.Other{background:var(--pass-bg);color:var(--pass)}
.block{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.headrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.headrow .send{font-weight:700}.headrow .late{color:var(--coord)}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:10px 0 0;padding:0}
.ov div{min-width:0}.ov dt{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.ov dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ov .wide{grid-column:1/-1}.ov .none{color:var(--muted);font-weight:400}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 22px}
.grp{margin-top:14px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.block h3,summary{margin:0 0 4px;font-size:1rem;font-weight:700}
.block p{margin:0}
.yes{color:var(--sent);font-weight:700}
.no{color:var(--verify);font-weight:700}
.tag{display:inline-block;margin-left:8px;font-size:.8rem;padding:1px 8px;border-radius:6px;background:var(--open-bg);color:var(--open);vertical-align:2px}
.tag.Hook{background:var(--coord-bg);color:var(--coord)}
details.block summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.block summary::-webkit-details-marker{display:none}
details.block summary::after{content:"Show";font-weight:400;font-size:.88rem;color:var(--accent)}
details.block[open] summary::after{content:"Hide"}
ul.lines{margin:6px 0 0;padding-left:1.1em}
ul.lines li{margin:2px 0}
.subject{margin:8px 0 6px;font-weight:700}
.body{white-space:pre-wrap;margin:0;padding:12px 14px;background:var(--bg);border-radius:8px;font:inherit;line-height:1.6;max-width:68ch}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{appearance:none;font:inherit;font-size:.95rem;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.status{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.st{appearance:none;font:inherit;font-size:.92rem;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.st[aria-pressed="true"]{font-weight:700}
.st[data-v="Sent"][aria-pressed="true"]{background:var(--sent-bg);color:var(--sent);border-color:var(--sent)}
.st[data-v="Hold"][aria-pressed="true"]{background:var(--hold-bg);color:var(--hold);border-color:var(--hold)}
.st[data-v="Pass"][aria-pressed="true"]{background:var(--pass-bg);color:var(--pass);border-color:var(--pass)}
.st[data-v="Coordinate"][aria-pressed="true"]{background:var(--coord-bg);color:var(--coord);border-color:var(--coord)}
.st[data-v="Verify"][aria-pressed="true"]{background:var(--verify-bg);color:var(--verify);border-color:var(--verify)}
.st:disabled,.btn:disabled{opacity:.6;cursor:default}
.sub-row{margin-top:8px;color:var(--muted)}
.sub-row input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
textarea{width:100%;min-height:72px;margin-top:4px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.saved{font-size:.85rem;color:var(--muted);margin-left:8px}
.tenants{list-style:none;margin:6px 0 0;padding:0}
.tenants li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.tenants li:last-child{border-bottom:0}
.pick{appearance:none;flex:none;font:inherit;font-size:.9rem;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pick[aria-pressed="true"]{background:var(--sent-bg);color:var(--sent);border-color:var(--sent);font-weight:700}
.pick:disabled{opacity:.6;cursor:default}
.pickbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.pick.pass[aria-pressed="true"]{background:var(--pass-bg);color:var(--pass);border-color:var(--pass);font-weight:700}
.done{color:var(--muted);font-size:.9rem}
.switch{display:flex;gap:6px;margin:0 0 4px}
.srch{position:relative;margin:6px 0 4px}
#q{width:100%;box-sizing:border-box;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.qs{position:absolute;left:0;right:0;top:100%;z-index:20;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.qs li{padding:8px 10px;border-radius:6px;cursor:pointer}
.qs li[aria-selected="true"],.qs li:hover{background:var(--bg)}
.qs .m{color:var(--muted);font-size:.85rem;margin-left:6px}
.card{scroll-margin-top:200px}
.card.flash{outline:3px solid var(--accent);outline-offset:2px}
.sw{appearance:none;font:inherit;font-size:1.05rem;font-weight:700;padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.sw[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.muted{color:var(--muted)}
.late-strong{color:var(--coord);font-weight:700}
.tick{appearance:none;flex:none;font:inherit;font-size:.9rem;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tick[aria-pressed="true"]{background:var(--sent-bg);color:var(--sent);border-color:var(--sent);font-weight:700}
.owe.is-done>span{text-decoration:line-through;color:var(--muted)}
.track{display:flex;flex-wrap:wrap;gap:4px;list-style:none;padding:0;margin:6px 0 0}
.stp{appearance:none;font:inherit;font-size:.85rem;padding:5px 10px;border-radius:6px;background:var(--bg);color:var(--muted);border:1px solid var(--line);cursor:pointer}
.stp.past{color:var(--ink)}
.stp.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.stp:disabled{cursor:default}
.wf{margin:0 0 6px;font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.hold-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);margin-left:6px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;margin:4px 0 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.tbx{appearance:none;flex:none;font:inherit;font-size:.9rem;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tbx[aria-pressed="true"]{background:var(--sent-bg);color:var(--sent);border-color:var(--sent);font-weight:700}
.tlist{list-style:none;margin:8px 0 0;padding:0}
.trow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.tbody{flex:1 1 260px;display:flex;flex-direction:column;gap:3px}
.ttl{font-weight:700}
.trow.is-done .ttl{text-decoration:line-through;color:var(--muted);font-weight:400}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pri{color:var(--coord)}
.tadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tadd #tTitle{flex:1 1 240px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.tadd select,.tadd input[type=date]{margin:0}
.tctl input[type=date],.tadd input[type=date]{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.tile-add{margin-top:8px}
.tile-add input[id^="tn-t-"]{flex:1 1 220px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:520px){body{font-size:16px}.card{padding:14px}}
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.vf{appearance:none;font:inherit;font-size:.92rem;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.vf[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.vf .n{margin-left:6px;font-variant-numeric:tabular-nums}
.vbar .btn{margin-left:auto}
.why{margin:8px 0 0;padding:8px 12px;border-radius:8px;background:var(--verify-bg);color:var(--verify);font-size:.92rem}
.why.ok{background:var(--sent-bg);color:var(--sent)}
.rnav{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:0 0 12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rnav .pos{font-weight:700;font-variant-numeric:tabular-nums}
.rnav .keys{color:var(--muted);font-size:.85rem;flex:1 1 260px}
.rnav kbd{font:inherit;font-size:.8rem;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
a.btn{text-decoration:none;display:inline-block}
.elink{margin-left:10px;font-size:.8rem;font-weight:700;vertical-align:middle;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--accent);text-decoration:none;white-space:nowrap}
.elink:hover{background:var(--open-bg)}
.undo{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px);padding:8px 10px 8px 14px;border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:.92rem}
.undo[hidden]{display:none}
.undo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo button{appearance:none;font:inherit;font-weight:700;padding:5px 12px;border-radius:7px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.wfrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lnk{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:.9rem;cursor:pointer;padding:2px 4px}
.fresh{margin:-4px 0 6px;color:var(--muted);font-size:.85rem}
.qbar{position:sticky;top:0;z-index:4;max-width:880px;margin:12px auto 0;padding:10px 14px;border:2px solid var(--verify);border-radius:10px;background:var(--verify-bg);color:var(--ink)}
.qrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.qbar .btns{margin:0}
.lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
.lock[hidden]{display:none}
.lockbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lockbox h1{font-size:1.4rem}
.lockbox input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
@media (max-width:520px){.qbar{margin:8px 8px 0}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="wfrow"><p class="wf">Work Flow</p><button class="lnk" id="lockOut" title="Forget the password on this computer">Lock</button></div>
    <p class="fresh"><span id="fresh"></span> <button class="lnk" id="qresend" hidden title="Use this if an update email was never sent">Resend waiting changes</button></p>
    <div class="switch" role="tablist" aria-label="Board"><button class="sw" data-board="bd" role="tab">BD Board</button><button class="sw" data-board="meetings" role="tab">Meetings</button><button class="sw" data-board="deals" role="tab">Deal Board</button><button class="sw" data-board="tasks" role="tab">Tasks</button></div>
    <div class="srch"><input id="q" type="search" placeholder="Search companies, people, addresses" autocomplete="off" aria-label="Search the board" aria-controls="qs"><ul id="qs" class="qs" role="listbox" hidden></ul></div>
    <p class="sub" id="sub">Loading cards</p>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<div class="qbar" id="qbar" hidden><div class="qrow"><strong id="qtext"></strong><span class="btns"><button class="btn primary" id="qsend">Email updates to the board</button><button class="btn" id="qcopy">Copy instead</button><button class="btn" id="qshow">Show</button></span></div><ul class="lines" id="qlist" hidden></ul></div>
<main id="main"><div class="msg">Loading cards</div></main>
<div class="lock" id="lock" hidden><form class="lockbox" id="lockForm"><h1>Work Flow</h1><p class="sub-row">Enter the board password.</p><input id="pw" type="password" autocomplete="current-password" aria-label="Password"><label class="sub-row"><input type="checkbox" id="remember"> Remember on this computer</label><button class="btn primary" id="lockBtn">Unlock</button><p class="sub-row" id="lockMsg" role="status"></p><p class="sub-row" style="font-size:.85rem">Waiting changes stay in this browser until you email them.</p></form></div>
<div class="sr" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="undo" id="undo" hidden><span id="undoLabel"></span><button id="undoBtn" title="Undo (Ctrl+Z)">Undo</button></div>
<script>
const TABS=["Overdue","Daily","Weekly New","Storyline","Bulk","Hold","Internal","Archive"];
const STATUSES=["Sent","Hold","Pass","Coordinate","Verify","Meeting set"];
let cards=[],tab="Weekly New",db=null,canWrite=true,pending=false;
const openSet=new Set(),noteTimers={},holdPicking=new Set(),sentPicking=new Set();
const KIRSTEN="Kirsten.Wenclawski@cbre.com";
const BLOCK_RE=/verify|pending|decide|not confirmed|not checked|needs|no enaia|bounced|left|coordinate|stale/i;
let view="All",review=false,rIdx=0;
function needReasons(c){
  const dm=c.dm||{},r=[];
  if(!c.body)r.push(c.suggestedAction?c.suggestedAction:"No draft");
  if(c.status)r.push(`Status: ${c.status}`);
  if(c.body&&c.tab!=="Internal"&&!dm.verified)r.push("Contact not verified in seat");
  if(c.body&&!dm.email)r.push("No email address");
  toList(c.flags).filter(f=>BLOCK_RE.test(f)&&!(f==="Verify"&&c.status==="Verify")).forEach(f=>r.push(f));
  return [...new Set(r)];
}
const isReady=c=>!needReasons(c).length;
// Outlook on the web compose link (opens a new tab; works without a mail app set as the default)
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function mailHref(c){
  const dm=c.dm||{};if(!c.body)return"";
  const q=[];if(EMAIL_RE.test(String(dm.email||"").trim()))q.push("to="+encodeURIComponent(dm.email.trim()));if(c.tab!=="Internal")q.push("bcc="+encodeURIComponent(KIRSTEN));
  q.push("subject="+encodeURIComponent(c.subject||""));q.push("body="+encodeURIComponent(c.body));
  return `https://outlook.office.com/mail/deeplink/compose?${q.join("&")}`;
}
function mailBtns(c,id){
  const mh=mailHref(c),last=c.lastMsgLink&&/^https:\/\/outlook\.office(365)?\.com\//.test(c.lastMsgLink)?c.lastMsgLink:"";
  return (last?`<a class="btn primary" href="${esc(last)}" target="_blank" rel="noopener" data-mail="${esc(id)}" title="${esc(c.lastMsgNote||"Last email in this thread")}">Open last email</a>`:"")+
    (mh?`<a class="btn${last?"":" primary"}" href="${esc(mh)}" target="_blank" rel="noopener"${last?"":` data-mail="${esc(id)}"`}>${EMAIL_RE.test(String((c.dm||{}).email||"").trim())?"New email in Outlook":"New email in Outlook (add To)"}</a>`:"");
}
// Undo: each status or decision click records the fields it changed so it can be put back
const undoStack=[];

async function runUndo(){
  const u=undoStack.pop();showUndo();if(!u||!db)return;
  try{for(const s of u.steps){const ref=db.collection(s.col).doc(s.id);if(s.del)await ref.delete();else await ref.update({...s.prev,updatedAt:new Date().toISOString()})}toast("Undone: "+u.label)}
  catch(_){toast("Undo failed. Try again.");undoStack.push(u);showUndo()}
}

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);

async function openBlob(env,key){

}

async function tryRemembered(){

  if(d.phases)p.push("stage: "+(d.phase||"none"));
  if("dealType" in d)p.push("deal type: "+(d.dealType||"not set"));
  if("flagMove" in d)p.push(d.flagMove?"flag folder move to "+d.flagMove:"move flag cleared");
  if(d.dismissedAttention)p.push("attention item cleared");
  return `${n}: ${p.length?p.join(", "):"updated"}`;
}
function renderQueue(){
  const un=queue.filter(a=>!a.sent),wait=queue.filter(a=>a.sent);
  const fr=$("#fresh");
  if(fr)fr.textContent=meta.publishedAt?`Data from ${new Date(meta.publishedAt).toLocaleString([], {month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})} (${ago(meta.publishedAt)})`+(wait.length?` · ${wait.length} emailed change${wait.length===1?"":"s"} waiting for the sync`:""):"";
  const old=wait.some(a=>Date.now()-Date.parse(a.sentAt||a.at)>60*60000);$("#qresend").hidden=!old;
  const bar=$("#qbar");if(!bar)return;
  if(!un.length){bar.hidden=true;return}
  bar.hidden=false;
  $("#qtext").textContent=`${un.length} change${un.length===1?"":"s"} not sent to the board yet`;
  $("#qlist").innerHTML=un.map(a=>`<li>${esc(describe(a))}</li>`).join("");
}
function b64url(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function packs(items){
  // Split into emails that keep the Outlook link a safe length
  const out=[];let cur=[];
  const size=arr=>JSON.stringify({v:1,actions:arr}).length*1.4+arr.length*90;
  for(const a of items){if(cur.length&&size([...cur,a])>5200){out.push(cur);cur=[]}cur.push(a)}
  if(cur.length)out.push(cur);return out;
}
function mailFor(group,i,n){
  const acts=group.map(({aid,col,id,op,data,at})=>({aid,col,id,op,data,at}));
  const names=[...new Set(group.map(nameOf))];
  const subj=`WF board update${n>1?` ${i+1} of ${n}`:""}: ${names.slice(0,3).join(", ")}${names.length>3?` +${names.length-3}`:""}`;
  const body=`Board changes from the Work Flow website. Send this email as is.\n\n${group.map(a=>"- "+describe(a)).join("\n")}\n\nDo not edit below this line.\n${MARK}:${b64url(JSON.stringify({v:1,actions:acts}))}:${MARK}`;
  return {subj,body,href:`https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(ME)}&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`};
}
function sendQueue(copyOnly){
  const un=queue.filter(a=>!a.sent);if(!un.length)return;
  const groups=packs(un),mails=groups.map((g,i)=>mailFor(g,i,groups.length));
  if(copyOnly){
    const txt=mails.map(m=>`To: ${ME}\nSubject: ${m.subj}\n\n${m.body}`).join("\n\n=====\n\n");
    navigator.clipboard.writeText(txt).then(()=>toast("Copied. Paste into a new email to yourself"),()=>toast("Copy blocked"));
  }else{
    mails.forEach((m,i)=>setTimeout(()=>window.open(m.href,"_blank","noopener"),i*400));
    toast(mails.length>1?`${mails.length} emails opened. Hit Send on each`:"Email opened. Hit Send in Outlook");
  }
  const now=new Date().toISOString();un.forEach(a=>{a.sent=true;a.sentAt=now});saveQ();renderQueue();
}
$("#qsend").addEventListener("click",()=>sendQueue(false));
$("#qcopy").addEventListener("click",()=>sendQueue(true));
$("#qshow").addEventListener("click",()=>{const l=$("#qlist");l.hidden=!l.hidden;$("#qshow").textContent=l.hidden?"Show":"Hide"});
$("#qresend").addEventListener("click",()=>{queue.forEach(a=>{if(a.sent)a.sent=false});saveQ();renderQueue();toast("Waiting changes moved back to unsent")});
window.addEventListener("beforeunload",e=>{if(queue.some(a=>!a.sent)){e.preventDefault();e.returnValue=""}});
setInterval(refresh,5*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
setInterval(renderQueue,60*1000);

(async()=>{
  if(!window.crypto||!crypto.subtle||typeof DecompressionStream==="undefined"){$("#main").innerHTML=`<div class="msg">This browser is too old for the board. Use a current Chrome, Edge, or Safari.</div>`;return}
  if(!(await tryRemembered()))showLock();
})();

function sIndex(){const out=[];cards.forEach(c=>{const dm=c.dm||{};out.push({kind:"c",id:c.id,title:c.company||c.id,where:c.tab||"",hay:[c.company,c.address,dm.name,c.landlord,c.industry,c.id].filter(Boolean).join(" ").toLowerCase()})});deals.forEach(d=>out.push({kind:"d",id:d.id,title:d.name||d.id,where:"Deal Board",hay:[d.name,d.address,d.id].filter(Boolean).join(" ").toLowerCase()}));meetings.forEach(m=>out.push({kind:"m",id:m.id,title:m.company||m.id,where:"Meetings",hay:[m.company,m.address,(m.dm||{}).name,m.folder,m.id].filter(Boolean).join(" ").toLowerCase()}));return out}
function qScore(e,q){const t=e.title.toLowerCase();if(t.startsWith(q))return 0;if(t.split(/[\s&+\/-]+/).some(w=>w.startsWith(q)))return 1;if(t.includes(q))return 2;if(e.hay.includes(q))return 3;const ws=q.split(/\s+/).filter(Boolean);if(ws.length>1&&ws.every(w=>e.hay.includes(w)))return 4;let i=0;for(const ch of t){if(ch===q[i])i++;if(i===q.length)return 5}return 9}
let qRes=[],qSel=0;
function showSug(){const q=$("#q").value.trim().toLowerCase();const ul=$("#qs");if(!q){ul.hidden=true;return}
  qRes=sIndex().map(e=>[qScore(e,q),e]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].title.localeCompare(b[1].title)).slice(0,8).map(x=>x[1]);qSel=0;
  ul.innerHTML=qRes.length?qRes.map((e,i)=>`<li role="option" data-qi="${i}" aria-selected="${i===0}">${esc(e.title)}<span class="m">${esc(e.where)}</span></li>`).join(""):`<li class="m">No match</li>`;ul.hidden=false}
function qMark(){document.querySelectorAll("#qs li[data-qi]").forEach(li=>li.setAttribute("aria-selected",String(+li.dataset.qi===qSel)))}
function goTo(e){if(!e)return;$("#qs").hidden=true;$("#q").value="";$("#q").blur();
  if(e.kind==="c"){const c=cards.find(x=>x.id===e.id);if(!c)return;board="bd";tab=c.tab}else if(e.kind==="m"){const m=meetings.find(x=>x.id===e.id);if(!m)return;board="meetings";mtab=mBucket(m)}else{const d=deals.find(x=>x.id===e.id);if(!d)return;board="deals";dtab=bucket(d)}
  render();setTimeout(()=>{const el=document.getElementById(e.kind+"-"+e.id);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),2500)}else toast("Found it, but the tile is hidden on that tab")},60)}
$("#undoBtn").addEventListener("click",runUndo);
document.addEventListener("keydown",e=>{const tg=e.target;if(tg&&tg.matches&&tg.matches("input,textarea,select"))return;if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&undoStack.length){runUndo();e.preventDefault()}});
$("#q").addEventListener("input",showSug);
$("#q").addEventListener("keydown",ev=>{if($("#qs").hidden)return;if(ev.key==="ArrowDown"){qSel=Math.min(qSel+1,qRes.length-1);qMark();ev.preventDefault()}else if(ev.key==="ArrowUp"){qSel=Math.max(qSel-1,0);qMark();ev.preventDefault()}else if(ev.key==="Enter"){goTo(qRes[qSel]);ev.preventDefault()}else if(ev.key==="Escape"){$("#qs").hidden=true}});
$("#qs").addEventListener("mousedown",ev=>{const li=ev.target.closest("li[data-qi]");if(li){ev.preventDefault();goTo(qRes[+li.dataset.qi])}});
$("#q").addEventListener("blur",()=>setTimeout(()=>{$("#qs").hidden=true},150));
</script>
